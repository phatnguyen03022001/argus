    - repository_content_write
    - native_local_execution
    - package_install
    - test_execution
    - production_build_execution
    - loopback_runtime_smoke
    - exact_diff_inspection
    - isolated_macos_keychain_fixture

acceptance_criteria:
  - id: AC-1
    requirement: "VN/EN responsive operator information architecture replaces the one-page foundation dump without losing accepted capability."
    evidence_required: >-
      UI tests and production smoke prove locale toggle/default Vietnamese, translated navigation/status/forms, Overview plus
      separated Repository/Environment/Credential/Provider destinations, no duplicate mega-page, accessible labels, and
      responsive CSS behavior without a new UI/i18n dependency.
  - id: AC-2
    requirement: "GitHub inventory returns the full credential-accessible repository set as bounded derived truth."
    evidence_required: >-
      Deterministic paginated API tests prove GET /user/repos traversal through final page, per-page bound, loop/host/size/
      schema failure handling, stable numeric repository identity, stale last-known retention and zero token/raw-response
      persistence. UI tests prove complete inventory/status/filter rendering.
  - id: AC-3
    requirement: "Local Argus watchlist and detailed watched-repository observation are identity-safe and mutation-free."
    evidence_required: >-
      Persistence/recovery tests prove add/remove/archive/rename-stable watch records; watched detail proves exact default
      branch/head plus optional Actions evidence and matched existing local sync/health/attention without GitHub/Git mutation,
      polling or subscription API calls.
  - id: AC-4
    requirement: "`.env.example` drift is explicit, repository-bound and secret-safe."
    evidence_required: >-
      Tests cover exact worktree containment/symlink rejection, parser behavior, absent template NOT_APPLICABLE, explicit
      repository-environment links, MATCHED/MISSING/EXTRA/WRONG_KIND outcomes, branch independence, secret-shaped key
      handling and no target `.env` value read/materialization.
  - id: AC-5
    requirement: "In-app environment and Keychain provisioning is write-only for secrets and fail-closed."
    evidence_required: >-
      Domain/route tests prove ordinary setting edits with optimistic versioning, secret binding edits, secure child-stdin
      Keychain write with no secret argv/env/temp/log/result exposure, exact-item availability verification, truthful partial
      outcome on post-Keychain persistence failure, and isolated temporary-Keychain create/update/read cleanup proof.
  - id: AC-6
    requirement: "Durability/security boundaries and existing Phase 2-5 behavior remain intact."
    evidence_required: >-
      Forward migration/reopen/export/restore covers watch/link APP_NATIVE_TRUTH; full repository regression including
      repository/environment/credential/Neon/native-Keychain tests remains green; runtime-random secret non-leak proof and
      exact dependency/forward-scope inspection pass.
  - id: AC-7
    requirement: "Implementation and canonical publication remain proportional and exact."
    evidence_required: >-
      Frozen install, mandatory full pnpm verify, production loopback smoke, exact diff/UI/security inspection, one direct
      implementation child and one report-only child, fresh remote proof, topology {main}, zero tags and final local hygiene.

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "Fresh-preflight exact TASK-0009/base, accepted TASK-0008 review, active agent-skills pin, clean synchronized MAIN_ONLY target and all required current EXECUTION capabilities."
      required: true
    - id: CHECK-2
      command_or_check: "Use TDD for GitHub pagination/watch identity, env-example drift, secure Keychain write/partial failure and locale/navigation behavior; focused checks remain causal or distinct acceptance evidence only."
      required: true
    - id: CHECK-3
      command_or_check: "Run deterministic GitHub API tests entirely against bounded local fakes. A live GitHub read may run only when an operator-configured credential already exists; no credential is created/requested for testing and live absence is not a blocker."
      required: true
    - id: CHECK-4
      command_or_check: "Run isolated native Keychain create/update/read proof only in a run-owned temporary keychain; inspect process invocation evidence proving secret bytes are absent from argv/env and clean only exact run-owned artifacts."
      required: true
    - id: CHECK-5
      command_or_check: "Run mandatory full repository verifier plus independent deterministic diff/schema/secret/UI checks through the smallest safe execution bundle; migrations, native Keychain mutation, live network checks and publication remain serial."
      required: true
    - id: CHECK-6
      command_or_check: "Run production loopback smoke on 127.0.0.1 using existing local operator data only for read/display where safe and run-owned data for mutation tests; prove VN/EN navigation and all primary pages load without exposing secrets."
      required: true
    - id: CHECK-7
      command_or_check: "Publish one implementation commit then one report-only child on main; fresh-resolve canonical remote identity after each push, keep zero tags/topology {main}, perform final local hygiene, and stop at NEEDS_REVIEW."
      required: true

