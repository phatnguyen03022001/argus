structure_authority:
  status: RESOLVED
  source: >-
    Preserve the existing single-package Next.js/TypeScript + SQLite application. Add the smallest local persistence,
    domain/application, native-macOS Keychain adapter, UI, and test surfaces required for this Phase 4 slice. No new
    package/service/top-level ownership boundary, ORM, generic credential framework, provider adapter framework, daemon,
    queue, worker, plugin system, or cloud secret store is authorized.

objective: >-
  Begin Phase 4 by making non-secret credential references durable Argus-owned records while keeping every secret value
  exclusively owned by macOS Keychain. Add a narrow secret-resolution boundary that can prove credential availability
  and transiently supply the minimum secret value only to an explicitly scoped in-process consumer, without returning,
  persisting, logging, exporting, rendering, auditing, or otherwise widening the secret value. This slice does not create
  or rotate real credentials, does not implement providers, and does not materialize .env files.

scope:
  required_changes:
    - >-
      Add durable credential-reference records as APP_NATIVE_TRUTH with stable Argus identity, intended external system,
      safe Keychain service/account locator metadata, optional label, created/updated timestamps, archived state, and
      optimistic versioning consistent with existing app-native records. Secret bytes/tokens/passwords/private keys are
      structurally absent from the record type and database schema.
    - >-
      Add the required forward SQLite migration and migration/reopen tests. Existing valid older stores must migrate
      forward safely; unsupported/newer schema behavior and rollback-on-migration-failure guarantees remain intact.
    - >-
      Extend export/restore so non-secret credential references are included as required APP_NATIVE_TRUTH. Restore must
      validate stable IDs, locator metadata, versions/lifecycle fields, duplicates, and relationships without ever
      containing or reconstructing secret values. Existing workspace/audit/repository data remains preserved.
    - >-
      Add create/list/archive or equivalent minimal lifecycle operations for credential references with deterministic
      validation and audit of Argus-native metadata changes. Audit records may identify the credential-reference record
      and operation but must contain no secret value or secret-shaped payload.
    - >-
      Implement a narrow macOS Keychain secret-resolution adapter/broker for a credential reference plus explicit
      operation context. Resolution success means credential availability only; it grants no target/action authority.
      Secret material may cross only the minimum adapter-to-consumer call boundary and must not be returned in ordinary
      domain/application result objects, errors, logs, persistence, audit, exports, or UI.
    - >-
      Fail closed when the Keychain item is missing, Keychain/native capability is unavailable, locator metadata is
      malformed, or the consumer fails. Diagnostics expose safe credential-reference identity/availability only and do
      not echo command stdout/stderr or secret values.
    - >-
      Add a read-only credential availability check through the same Keychain boundary and surface credential-reference
      metadata plus AVAILABLE/UNAVAILABLE status in the existing local UI. The UI must contain no secret-value input,
      reveal/copy control, plaintext secret display, or browser-visible secret payload.
    - >-
      Provide deterministic fake-adapter tests plus one bounded native macOS Keychain integration test using a run-owned
      isolated temporary keychain or equivalently isolated non-login-keychain fixture. The test may create and remove
      only its own uniquely identified temporary Keychain fixture/item, must never enumerate/read operator login-keychain
      contents, and must prove cleanup. If the current execution surface cannot safely create this isolated fixture,
      fail CURRENT_PHASE_CAPABILITY_UNAVAILABLE rather than touching operator credentials.
    - >-
      Security-negative tests must mechanically prove a unique fixture secret is absent from SQLite bytes/logical rows,
      export JSON, restore/audit data, rendered UI, safe error messages, repository diff, report artifact, and ordinary
      application result objects. Do not rely only on code review for this invariant.
    - >-
      Update README only as needed to state Phase 4 credential-reference/Keychain boundary truthfully; do not document
      .env/provider capabilities that do not exist yet.
    - >-
      Run fresh frozen-lockfile install, full repository-owned pnpm verify, bounded 127.0.0.1 production smoke with
      run-owned temporary Argus data, exact migration/export/security/diff/dependency/forward-scope inspection, publish
      one implementation commit plus one report-only direct child on main, and stop at NEEDS_REVIEW.

  allowed_existing_files_or_components:
    - existing SQLite persistence/migration/recovery/audit surfaces under src/
    - existing application/domain surfaces under src/
    - existing Next.js routes/UI under app/ and src/
    - existing tests under tests/
    - README.md if capability wording becomes stale
    - .agent/tasks/TASK-0006/report.yaml
  expected_files_are_restrictive: false

invariants:
  - "macOS Keychain remains the sole owner of secret values; Argus persists references/metadata only."
  - "Credential availability is capability evidence only and never mutation/action authority."
  - "Secret values are absent from SQLite, repository artifacts, logs, audit, exports/backups, restore documents, UI, HTTP responses, and report evidence."
  - "No fallback secret store, encrypted secret column, environment-variable secret persistence, plaintext file, .env materialization, or browser/localStorage secret copy is introduced."
  - "Native Keychain tests touch only run-owned isolated fixture state and never enumerate or mutate operator login-keychain credentials."
  - "No provider integration, Git/GitHub mutation, task/agent/business feature, cloud service, branch, tag, release, workflow, deployment, queue, worker, watcher, daemon, or Phase 5+ capability is introduced."
  - "Topology remains MAIN_ONLY exactly {main}."

forbidden_changes:
  - "Do not add secret values to credential-reference types/schema, audit reason payloads, exports, logs, errors, UI, tests/reports, or repository configuration."
  - "Do not implement credential creation/rotation/revocation in the operator login keychain, provider credentials, OAuth flows, .env files, secret vaults, encryption-at-rest schemes, or cloud secret managers."
  - "Do not add dependencies, ORM, SDK, provider framework, generic secret plugin registry, background process, queue, or orchestration layer."
  - "Do not infer environment from Git branches or add environment/deployment/provider mapping in this task."
  - "Do not mutate another repository or agent-skills/main."

