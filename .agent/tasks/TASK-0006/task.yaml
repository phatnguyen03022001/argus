acceptance_criteria:
  - id: AC-1
    requirement: "Credential references are durable non-secret APP_NATIVE_TRUTH with safe lifecycle/version semantics."
    evidence_required: >-
      Domain/persistence tests prove create/list/archive/version behavior and schema contains only non-secret metadata;
      migration/reopen from the prior schema is deterministic and safe.
  - id: AC-2
    requirement: "Export/restore preserves credential references but never secret values."
    evidence_required: >-
      Export/restore tests prove exact non-secret reference round-trip, malformed/duplicate rejection, existing data
      preservation, and absence of fixture secret from serialized backup/restore content.
  - id: AC-3
    requirement: "Keychain resolution is narrow, transient, fail-closed, and authority-neutral."
    evidence_required: >-
      Fake-boundary tests prove secret is available only inside the scoped consumer call; ordinary results/errors expose
      safe identity/availability only; missing capability/item/consumer failure does not leak secret or imply authority.
  - id: AC-4
    requirement: "Native macOS Keychain behavior is proven without touching operator credentials."
    evidence_required: >-
      Bounded integration test creates a uniquely named run-owned isolated temporary keychain/item, resolves through the
      production boundary, proves expected non-secret outcome, removes the fixture, and shows no login-keychain enumeration.
  - id: AC-5
    requirement: "UI manages references/availability without secret handling."
    evidence_required: >-
      UI/route tests show non-secret reference metadata and AVAILABLE/UNAVAILABLE result while proving no secret input,
      secret response body, reveal/copy control, or fixture-secret rendering.
  - id: AC-6
    requirement: "Secret non-leakage is mechanically verified across all ordinary durable/observable surfaces."
    evidence_required: >-
      A unique fixture secret is absent from SQLite bytes/logical rows, export JSON, audit, UI markup/HTTP results, safe
      errors, exact repository diff, and report content; existing repository observation/assessment tests remain green.
  - id: AC-7
    requirement: "Phase 4 slice remains proportional and exact."
    evidence_required: >-
      Frozen install, full pnpm verify, production loopback smoke and hygiene PASS; exact diff proves no dependency,
      provider/.env/Phase5+, branch/tag/release/workflow/deployment expansion; implementation/report lineage is exact.

