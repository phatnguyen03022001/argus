      command_or_check: "Fresh-preflight exact TASK-0006 revision/base/task blob, accepted TASK-0005 review identity, clean synchronized MAIN_ONLY state, native macOS/Keychain isolated-fixture capability, and all required EXECUTION capabilities before mutation."
      required: true
    - id: CHECK-2
      command_or_check: "Run migration/persistence/lifecycle plus export/restore credential-reference tests, including malformed/duplicate/failure cases."
      required: true
    - id: CHECK-3
      command_or_check: "Run fake Keychain boundary tests and bounded native isolated-temporary-keychain integration with exact fixture cleanup; never touch login-keychain contents."
      required: true
    - id: CHECK-4
      command_or_check: "Run UI/route availability tests and mechanical unique-secret non-leak scan across DB/export/audit/UI/errors/result objects/repository diff/report candidate."
      required: true
    - id: CHECK-5
      command_or_check: "Run existing Phase 2-3 regressions, fresh pnpm install --frozen-lockfile, full pnpm verify, then bounded 127.0.0.1 production smoke using run-owned temporary Argus data."
      required: true
    - id: CHECK-6
      command_or_check: "Inspect exact diff, schema/migration, dependencies, subprocess/Keychain boundary, secrets, runtime artifacts and forward-scope terms; require no secret store, provider, .env, Phase5+, or external mutation."
      required: true
    - id: CHECK-7
      command_or_check: "Publish one implementation commit plus one report-only child; re-resolve final GitHub main, parents/diffs, task/report blobs, clean local state, zero tags and topology exactly {main}."
      required: true
  authoritative_verification:
    required: false
    mechanism: ""
    expected_signal: ""

