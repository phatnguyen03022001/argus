acceptance_criteria:
  - id: AC-1
    requirement: "Phase 0/1 documentation is structurally closed under pinned agent-documents v1.0.0."
    evidence_required: "All eight authority-domain roots and docs/catalog/project.json are valid, milestone scope is FROZEN, required coverage is satisfied, references resolve, material entities are reachable, and no blocking DESIGN unknown remains."
  - id: AC-2
    requirement: "Product boundary and four truth/ownership classes are explicit and non-overlapping."
    evidence_required: "PRODUCT/DATA/ARCHITECTURE consistently distinguish EXTERNAL_DERIVED_TRUTH, APP_NATIVE_TRUTH, SECRETS and CONFIRMED_PRODUCT_TRUTH with canonical owner, allowed Argus behavior, persistence and promotion boundaries."
  - id: AC-3
    requirement: "Deterministic identity is sufficient for reconciliation and cross-phase traceability."
    evidence_required: "Identity rules cover repositories, commits/refs, tasks/revisions, local workspaces, external resources, app-native records, observations and promoted requirements; weaker names/paths are not used when canonical IDs or immutable SHAs exist."
  - id: AC-4
    requirement: "Observation provenance/freshness reconciliation is closed."
    evidence_required: "Derived observations carry value, source, observed_at, identity, freshness and availability/confidence semantics; docs specify freshness, supersession, conflict handling, stale/offline/unavailable behavior and provenance retention without stale-as-fresh ambiguity."
  - id: AC-5
    requirement: "Health and attention remain explainable derived views rather than mutable truth."
    evidence_required: "Behavior/data rules derive health/attention from explicit inputs, expose reasons, preserve unknown/stale states and create neither implicit task authority nor a hidden mutable queue."
  - id: AC-6
    requirement: "Offline semantics are fail-closed and useful."
    evidence_required: "Argus-native durable data and last-known observations remain usable offline, external freshness is visible, and operations requiring live external preconditions cannot report success or enter an implicit durable mutation queue."
  - id: AC-7
    requirement: "App-native durability and cache separation are implementation-ready without choosing storage technology."
    evidence_required: "DATA/DELIVERY specify schema versioning, migration, backup/export, restore, restore validation, failure/corruption handling and cache-loss behavior while keeping storage engine and ORM selection deferred."
  - id: AC-8
    requirement: "Secret ownership is hard-bounded to macOS Keychain."
    evidence_required: "Docs forbid secret values in ordinary persistence, repo artifacts, logs, exports/backups and audit payloads; only non-secret references/metadata may be stored, and credential availability is distinct from authority."
  - id: AC-9
    requirement: "Audit semantics are bounded, useful and non-authoritative."
    evidence_required: "Audit requirements cover operator-significant native changes and controlled mutation attempts/results with exact identities, authority/intent, outcome and time while excluding secrets and not duplicating external SSOT."
  - id: AC-10
    requirement: "Capability contracts are transport-independent."
    evidence_required: "INTERFACES/ARCHITECTURE define semantic capabilities and keep GitHub connectors, Agent Runtime, local tooling, MCP/provider transports and SDKs behind future adapters; capability availability never grants authority."
  - id: AC-11
    requirement: "Requirement-to-product promotion preserves source-of-truth ownership."
    evidence_required: "Working opportunity/client/requirement state remains app-native until explicit acceptance; accepted product truth moves into the target repository through a traceable promotion and Argus no longer acts as sole canonical owner."
  - id: AC-12
    requirement: "Controlled mutation contract is explicit and fail-closed without runtime implementation."
    evidence_required: "The contract binds target identity, expected prior state, authority, capability, change intent, preview/diff when meaningful, execution result, verified postcondition and audit evidence; stale/missing/unverifiable inputs block mutation."
  - id: AC-13
    requirement: "Future testing boundaries cover deterministic domain, persistence, adapters and mutation safety."
    evidence_required: "QUALITY defines the required unit/contract/integration/evidence boundaries, migration/restore verification and prohibition on destructive testing against operator production state without adding runtime tests now."
  - id: AC-14
    requirement: "Engineering MVP scope and non-goals are frozen at the correct boundary."
    evidence_required: "Engineering MVP ends at Phase 5, excludes Phase 6+ authority/agent/business/automation/analytics work, and explicitly defers framework/ORM/Tauri/MCP/provider SDK/database-engine/runtime choices."
  - id: AC-15
    requirement: "The full agreed milestone program is persisted without turning sequencing into orchestration."
    evidence_required: "DELIVERY/PRODUCT/DECISIONS contain the exact Phase 0-14 sequence and Engineering MVP/Engineering V1/Business V1 boundaries, with only enough dependency intent for sequencing and no generated execution DAG."
  - id: AC-16
    requirement: "Execution remains documentation-only, bounded and reconstructible."
    evidence_required: "Base-to-implementation diff contains only the nine authorized documentation/catalog files; report is a report-only direct child; README/task remain unchanged; topology is exactly {main}; no runtime/dependency/workflow/branch/tag/release mutation exists."

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "Verify exact handoff base, TASK-0001 revision 1, pinned agent-skills/agent-documents commit identities, repository identity, and topology exactly {main} before mutation."
      required: true
    - id: CHECK-2
      command_or_check: "Inspect the bootstrap baseline and build a concise ownership matrix for the four truth classes, their canonical owners, persistence rules, mutation rules and promotion boundaries before writing."
      required: true
    - id: CHECK-3
      command_or_check: "Validate docs/catalog/project.json and every logical reference/coverage/closure rule against agent-documents v1.0.0 using its pinned deterministic validator or an equivalent deterministic check on an authorized execution surface."
      required: true
    - id: CHECK-4
      command_or_check: "Run scenario checks for fresh/stale/unavailable/conflicting observations, offline operation, cache loss, app-native restore/migration failure, missing Keychain secret, and derived health/attention explainability."
      required: true
    - id: CHECK-5
      command_or_check: "Run contract scenario checks for requirement promotion and controlled mutation: exact identity drift, missing authority, missing capability, stale precondition, failed side effect, unverifiable postcondition and audit evidence without secret leakage."
      required: true
    - id: CHECK-6
      command_or_check: "Cross-check PRODUCT, BEHAVIOR, ARCHITECTURE, DATA, INTERFACES, QUALITY, DELIVERY and DECISIONS for contradictory ownership, duplicated SSOT, hidden runtime choices, unresolved Phase 0/1 design blockers or milestone-boundary drift."
      required: true
    - id: CHECK-7
      command_or_check: "Inspect exact base-to-implementation diff and prove only the nine authorized docs/catalog files changed, no runtime/dependency/workflow artifacts were added, README/task were unchanged, and topology remained exactly {main}."
      required: true
    - id: CHECK-8
      command_or_check: "Publish one implementation commit and one report-only direct child, then re-resolve remote lineage, final diff, task/report identity and topology before stopping at NEEDS_REVIEW."
      required: true
  authoritative_verification:
    required: false
    mechanism: ""
    expected_signal: ""

