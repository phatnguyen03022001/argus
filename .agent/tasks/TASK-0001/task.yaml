structure_authority:
  status: RESOLVED
  source: "TASK-0001 revision 1 plus agent-documents v1.0.0 default small-project authority-domain model."
  rationale: >-
    Phase 0/1 is documentation-only foundation closure. Use the eight canonical agent-documents
    root authority domains plus one project catalog and the canonical task report. No runtime
    source tree, dependency manifest, framework scaffold, provider SDK integration, documentation
    shard, registry, generated program, or additional top-level structure is justified yet.

objective: >-
  Close Argus Phase 0 Reality baseline and Phase 1 Vision + ownership design so the repository has
  one target-authoritative, internally consistent, implementation-driving foundation for the
  Engineering MVP without selecting runtime implementation technology or implementing product
  behavior. Freeze the product boundary, truth ownership, identity/reconciliation semantics,
  durability/security/mutation/testing boundaries, Engineering MVP scope, non-goals, and agreed
  milestone program, then stop at NEEDS_REVIEW.

scope:
  required_changes:
    - >-
      Materialize the agent-documents v1.0.0 small-project authority model as docs/PRODUCT.md,
      docs/BEHAVIOR.md, docs/ARCHITECTURE.md, docs/DATA.md, docs/INTERFACES.md, docs/QUALITY.md,
      docs/DELIVERY.md, docs/DECISIONS.md, and docs/catalog/project.json. The Phase 0/1 milestone
      must be closed-world and FROZEN only when its blocking design gaps reach zero.
    - >-
      Define Argus as an operator-local control plane/workspace that observes external engineering
      and provider state, owns explicit Argus-native working records, keeps secrets outside ordinary
      application data, and projects confirmed product truth back to the target repository instead
      of becoming a second source of truth.
    - >-
      Define exactly four ownership/truth classes and their boundaries:
      EXTERNAL_DERIVED_TRUTH for GitHub, target repositories, agent-* repositories, provider APIs,
      local Git and other observed external state that Argus may observe/index/cache but does not
      own; APP_NATIVE_TRUTH for durable Argus-owned records that require migration, backup/export,
      restore and lifecycle semantics; SECRETS for secret material owned by macOS Keychain with
      Argus storing references/metadata only; and CONFIRMED_PRODUCT_TRUTH for accepted product
      decisions/requirements whose canonical destination is the relevant target repository.
    - >-
      Define deterministic identity rules for repositories, refs/commits, tasks/revisions,
      workspaces, external resources, app-native records, observations and promoted requirements.
      Prefer canonical source IDs and immutable SHAs where available; never use a display name,
      mutable branch tip, or local path alone as identity when a stronger canonical identity exists.
    - >-
      Define the observation/reconciliation model for all derived state. Every material derived
      observation must carry at least value, source, observed_at, identity, freshness, and explicit
      availability/confidence semantics. Specify source-specific freshness evaluation, stale and
      unavailable behavior, conflict/reconciliation precedence, and how later observations supersede
      views without erasing provenance. Unknown/unavailable/stale must never be represented as fresh
      healthy state.
    - >-
      Define derived health and attention semantics as deterministic views over current observations,
      provenance, freshness, policy and explicit operator-owned state. Health/attention is not a new
      external source of truth, must expose its reasons/inputs, and must not create an implicit task
      queue or mutation authority.
    - >-
      Define offline semantics. Argus-native durable data and last-known observations remain readable
      offline; external state must be visibly stale/unavailable according to its freshness policy;
      operations that require live external preconditions must fail closed rather than fabricate
      success. Do not introduce a durable offline external-mutation queue in the Engineering MVP.
    - >-
      Define APP_NATIVE_TRUTH durability requirements independent of storage engine/ORM: schema
      versioning, forward migration discipline, backup/export, restore, restore validation,
      corruption/failure handling, and enough lifecycle semantics that Argus-owned records can be
      recovered without relying on external systems. Distinguish cached derived data from durable
      app-native records so cache loss never destroys Argus-owned truth.
    - >-
      Define the secret boundary around macOS Keychain. Secret values, tokens and credentials must
      not be persisted in ordinary app-native data, repository artifacts, logs, backups/exports or
      audit payloads. Argus may persist only non-secret references and metadata needed to locate or
      describe credentials. Secret availability never grants mutation authority.
    - >-
      Define the audit boundary for operator-significant Argus-native changes and controlled
      mutation attempts/results. Audit evidence must retain deterministic target identity,
      intent/authority reference, relevant pre/post identity, outcome and time while excluding
      secret material. Audit data is evidence, not a replacement for GitHub, provider or target
      repository truth.
    - >-
      Define a transport-independent semantic capability interface between Argus and execution
      surfaces. Capabilities describe what can be done or observed; GitHub connectors, Agent Runtime,
      local tools, future MCP transports, provider clients or other adapters are implementation
      mechanisms and must not leak into the product-domain contract. Capability availability and
      action authority remain separate.
    - >-
      Define the requirement-to-product promotion boundary. Opportunity/client/requirement working
      state remains APP_NATIVE_TRUTH until explicitly accepted for a target product; accepted product
      truth must be materialized in the target repository through a controlled, traceable promotion
      with stable references, after which Argus must not act as the sole canonical owner of that
      product decision.
    - >-
      Define the controlled mutation contract without implementing it. A mutation must bind exact
      target identity, expected prior state/preconditions, authority, required capability, intended
      change, bounded preview/diff where meaningful, execution outcome, postcondition verification
      and audit evidence. Drift, missing authority, missing capability or unverifiable postcondition
      fails closed. Broad destructive cleanup, force mutation and hidden autonomous side effects are
      outside the foundation contract.
    - >-
      Define testing boundaries for future runtime work: deterministic tests for identity,
      freshness/reconciliation and derived health; storage migration/backup/restore tests for
      APP_NATIVE_TRUTH; contract tests for capability adapters; mutation safety/precondition tests
      against fixtures/fakes; bounded integration tests for real boundaries; and no destructive
      tests against operator production state. Do not create runtime tests in this task.
    - >-
      Freeze the Engineering MVP boundary as completion through Phase 5 only:
      Phase 0 Reality baseline -> Phase 1 Vision + ownership closure -> VISION LOCK ->
      Phase 2 Local workspace foundation -> Phase 3 Git / repo control ->
      Phase 4 Environment + secrets -> Phase 5 Providers + resources -> ENGINEERING MVP.
      The Engineering MVP must remain foundation/control-plane focused and must not absorb later
      task projection, agent execution, business workflow, automation or analytics scope.
    - >-
      Persist the agreed full milestone program and boundaries exactly:
      PHASE 0 Reality baseline;
      PHASE 1 Vision + ownership closure;
      VISION LOCK;
      PHASE 2 Local workspace foundation;
      PHASE 3 Git / repo control;
      PHASE 4 Environment + secrets;
      PHASE 5 Providers + resources;
      ENGINEERING MVP;
      PHASE 6 Authority + task projection;
      PHASE 7 Agent execution + continuity;
      ENGINEERING V1;
      PHASE 8 SF opportunity/client workspace;
      PHASE 9 Requirement/scope/commercial control;
      PHASE 10 Client project -> engineering -> delivery;
      BUSINESS V1;
      PHASE 11 Templates + project onboarding;
      PHASE 12 Controlled mutations/automation;
      PHASE 13 Analytics + governance learning;
      PHASE 14 Hardening.
      Document dependencies and milestone intent only to the depth needed for sequencing; do not turn
      the program into a runtime orchestrator or generated execution DAG.
    - >-
      Make non-goals explicit: no dev/staging branch; no runtime implementation; no UI framework,
      Tauri, ORM, database engine, MCP transport, provider SDK or agent framework selection; no
      cloud/multi-user control plane; no generic workflow engine/orchestrator/queue; no duplicated
      GitHub/repository/provider SSOT; no secret-vault replacement; no autonomous destructive
      mutation; no SF/business workflow implementation; no analytics implementation; and no
      framework-shaped abstractions without current Phase 0/1 evidence.
    - >-
      Resolve all Phase 0/1 blocking DESIGN unknowns that can materially change correctness,
      ownership, security, durability, interfaces or Engineering MVP scope. Implementation-local
      technology choices intentionally deferred by this task may remain deferred only when their
      boundary and decision timing are explicit and they do not block Phase 2.
    - >-
      Publish one bounded documentation implementation commit and one canonical TASK-0001 report-only
      direct child, preserve topology exactly {main}, and stop at NEEDS_REVIEW. Do not execute any
      later milestone.
  allowed_existing_files_or_components:
    - README.md
    - .agent/tasks/TASK-0001/task.yaml
  expected_files_are_restrictive: true

invariants:
  - "GitHub remote state remains canonical repository truth; topology remains exactly {main} under MAIN_ONLY."
  - "Argus never becomes canonical owner of EXTERNAL_DERIVED_TRUTH or CONFIRMED_PRODUCT_TRUTH that belongs in a target repository."
  - "APP_NATIVE_TRUTH is genuinely Argus-owned and must remain recoverable through explicit durability, migration, backup/export and restore semantics."
  - "SECRETS remain outside ordinary app-native persistence, repository artifacts, logs, backups/exports and audit payloads."
  - "Authority, capability availability, observed state, freshness and derived health/attention remain distinct concepts."
  - "Every material derived state is attributable to deterministic identity, source, observation time and freshness/availability evidence."
  - "Stale, unavailable or unknown external state can never silently degrade into fresh/healthy state."
  - "Confirmed target-product truth is promoted into the target repository through an explicit traceable boundary; Argus does not retain sole ownership."
  - "Controlled mutation semantics are fail-closed on stale identity, authority mismatch, capability absence or unverifiable postconditions."
  - "Phase 0/1 closes foundation design only; Engineering MVP implementation begins no earlier than Phase 2 after VISION LOCK."
  - "Engineering MVP ends at Phase 5; Engineering V1 ends at Phase 7; Business V1 ends at Phase 10."
  - "No implementation framework, ORM, Tauri, MCP transport, provider SDK, database engine or agent framework is selected by TASK-0001."
  - "No runtime source, executable, dependency manifest, workflow, branch, tag, release or repository metadata mutation is introduced."
  - "Documentation follows agent-documents v1.0.0 authority ownership and reaches closure by evidence, not prose volume."

forbidden_changes:
  - "Do not modify README.md or TASK-0001 authority during execution."
  - "Do not create dev, staging, feature, temporary, backup or review branches."
  - "Do not add runtime source code, UI code, executables, package/dependency manifests, Docker/Compose, CI workflows, deployment configuration or generated runtime artifacts."
  - "Do not select or scaffold a UI framework, Tauri, ORM, database engine, MCP implementation, provider SDK, agent framework, queue, workflow engine or orchestration framework."
  - "Do not mutate architect-profile, agent-skills, agent-documents, agent-standards, agent-runtime, SF or any external repository."
  - "Do not implement Phase 2 or later functionality, including local workspace runtime, Git control runtime, secrets integration, provider integration, task projection, agent execution, business workflows, automation, analytics or hardening."
  - "Do not create a generated PROGRAM artifact, task DAG, registry, cache service, background worker or another source of mutable authority."
  - "Do not weaken GitHub SSOT, target-repository product truth, Keychain secret ownership, deterministic identity, provenance/freshness, fail-closed mutation or backup/restore requirements to simplify documentation."
  - "Do not use N/A or deferred implementation choices to hide unresolved Phase 0/1 design blockers."

