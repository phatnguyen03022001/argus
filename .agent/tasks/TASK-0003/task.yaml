structure_authority:
  status: RESOLVED
  source: "TASK-0003 revision 4 bounded review correction."
  rationale: >-
    Preserve the existing Phase 3 implementation shape. Correct only the runtime Git read boundary, local
    observation source-version assignment, focused regression evidence, and stale README capability wording.
    No new source file, dependency, abstraction, service, route, persistence schema, UI feature, or directory is
    needed or authorized.

objective: >-
  Close the exact TASK-0003 revision-3 review gaps without redesigning the accepted Phase 3 observation slice:
  prevent system Git observation from performing optional index/stat-cache writes in discovered operator
  repositories, retain immutable source-version evidence only where semantically valid, refresh the README to the
  current Phase 3 read-only observation boundary, reverify the complete existing slice, publish one bounded
  correction commit plus report revision 2, and stop at NEEDS_REVIEW.

scope:
  required_changes:
    - >-
      Make every runtime system-Git observation subprocess operationally read-only by setting
      `GIT_OPTIONAL_LOCKS=0` (or an exactly equivalent Git-supported no-optional-write mechanism) in the child Git
      environment while preserving the inherited process environment needed for normal Git resolution. The setting
      must cover every command admitted through the production read-only Git boundary, including status, without
      changing fixture-only Git commands used to construct tests.
    - >-
      Add a causal regression fixture that creates a committed tracked file, changes only filesystem stat/mtime so
      the index can be refreshed without content change, records exact `.git/index` bytes or cryptographic hash,
      executes the production local-repository observation path, and proves index/HEAD/refs/config/worktree/remotes
      remain unchanged. The test must fail against the revision-3 implementation or otherwise demonstrate the
      reproduced default-Git mutation condition and prove the corrected boundary prevents it.
    - >-
      Refine local observation source-version semantics. Mutable facts whose values can change independently of
      HEAD (`git.dirty`, `git.remotes`, `git.branch`, `git.detached`, `git.upstream`, `git.ahead-behind`, and mutable
      local/path metadata) must not use HEAD as immutable source-version evidence. `git.head` must retain the exact
      full commit SHA as source-version evidence because the immutable version is available and governs that fact.
      Preserve generic same-immutable-version conflict detection and do not manufacture conflicts for mutable facts.
    - >-
      Extend focused tests to prove `git.head` persists its SHA as `source_version`, mutable local facts use null (or
      equivalent explicit absence) for source version, dirty-at-same-HEAD remains non-conflicted, and the existing
      genuine immutable same-version conflict fixture remains CONFLICTED.
    - >-
      Update README current-capability wording only: Argus now includes the Phase 2 local workspace foundation plus
      Phase 3 read-only repository/worktree discovery and Git/GitHub observation. State clearly that current Phase 3
      does not perform repository health/attention classification or Git mutation/sync actions and that later
      environment/provider/task/agent/business capabilities remain out of scope. Preserve loopback/local-data and
      verification instructions unless current implementation evidence requires a factual correction.
    - >-
      Rerun the full TASK-0003 verification boundary after correction: focused no-mutation/source-version tests,
      complete repository-observation/application/adapter/workspace tests, frozen-lockfile install, repository-owned
      `pnpm verify`, bounded production loopback smoke on 127.0.0.1 with run-owned temporary Argus data, local hygiene,
      and exact diff/dependency/secret/forward-scope inspection.
    - >-
      Publish exactly one correction implementation commit as a direct child of the revision-4 handoff base. Then
      update only `.agent/tasks/TASK-0003/report.yaml` to TASK-0003 revision 4 / report revision 2 as the report-only
      direct child, binding the new correction implementation SHA and fresh evidence. Push main, re-resolve final
      GitHub identity/topology/local cleanliness, and stop at NEEDS_REVIEW. Do not modify review.yaml; Architect owns
      the next review revision.
  allowed_existing_files_or_components:
    - src/repositories.ts
    - src/repository-observations.ts
    - tests/repository-observation.test.ts
    - README.md
    - .agent/tasks/TASK-0003/report.yaml
  expected_files_are_restrictive: true

invariants:
  - "GitHub remote main remains canonical repository truth and target topology remains exactly {main}."
  - "The existing Phase 3 repository discovery/observation behavior is preserved; revision 4 is correction-only."
  - "No production Git observation may intentionally or optionally write index, refs, config, worktree files, remotes, hooks, or other discovered-repository state."
  - "GIT_OPTIONAL_LOCKS=0 or an equivalent no-optional-write Git mechanism applies to the production observation subprocess boundary, not globally to unrelated operator commands."
  - "HEAD SHA is source-version evidence for git.head only where it semantically versions the fact; mutable facts remain independently refreshable at unchanged HEAD."
  - "Generic explicit conflict semantics for truly immutable same-version evidence remain intact."
  - "No secret value enters Argus persistence, logs, UI, audit, tests, exports, or repository artifacts."
  - "No health/attention projection, Git sync/mutation action, Phase 4+ feature, dependency, schema expansion, branch, tag, release, workflow, or deployment is introduced."

forbidden_changes:
  - "Do not modify app UI/source, persistence schema, workspace application modules, package.json, pnpm-lock.yaml, accepted TASK-0001/TASK-0002 artifacts, TASK-0003 review.yaml, or any file outside the five explicitly allowed existing files/components."
  - "Do not add dependencies or new files/directories."
  - "Do not invoke runtime Git fetch/pull/merge/rebase/checkout/switch/reset/clean/stash/add/commit/push/config-write/remote-write/gc/prune/worktree mutation against discovered operator repositories."
  - "Do not weaken or remove the production read-only Git allowlist to make the regression pass."
  - "Do not implement repository health/attention, sync actions, environment/Keychain, providers/resources, task projection, agent integration, business flows, analytics, background polling/watchers, or deployment behavior."
  - "Do not create branches/tags/releases/workflows or mutate another repository."

