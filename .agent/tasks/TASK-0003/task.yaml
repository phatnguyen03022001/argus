acceptance_criteria:
  - id: AC-1
    requirement: "Configured workspace roots yield bounded deterministic discovery of local Git repositories and linked worktrees without mutating them."
    evidence_required: "Fixture/integration tests prove normal repo + .git-file worktree discovery, ordinary directory rejection, nested-repository traversal stop, symlink-cycle safety, stable workspace/path linkage, and byte/ref/config invariance of discovered repositories after scan."
  - id: AC-2
    requirement: "Local Git observations expose the minimum raw evidence needed for later health derivation."
    evidence_required: "Tests prove full HEAD SHA, symbolic branch/detached state, dirty status, configured remotes/upstream and read-only ahead/behind evidence where locally available, with explicit unknown states when not provable."
  - id: AC-3
    requirement: "GitHub-hosted repositories resolve stronger canonical source identity and live ref evidence without Argus-owned credentials."
    evidence_required: "Normalized HTTPS/SSH GitHub remotes resolve via injected/fake gh contract to provider immutable repo ID, canonical alias/default branch and live ref SHA; missing gh/auth/repository/ref/non-GitHub remote returns explicit unavailable/unknown evidence and no credential value is captured."
  - id: AC-4
    requirement: "Persisted repository observations satisfy the frozen provenance/freshness model."
    evidence_required: "SQLite migration/tests prove deterministic observation/source/subject identities, observed_at, value/absence, availability, CURRENT-on-success on-demand freshness, stale/unknown last-known preservation on failed later refresh, provenance/version evidence, and conflict preservation without APP_NATIVE_TRUTH ownership confusion."
  - id: AC-5
    requirement: "Repository identity remains stable across aliases and local paths."
    evidence_required: "Tests prove two observations/paths that resolve the same immutable GitHub repo identity link to that canonical repository without making path, URL, display name, branch or owner/name alias the primary identity; stronger identity adoption does not destroy prior provenance."
  - id: AC-6
    requirement: "The local UI exposes inspectable raw repository/Git evidence rather than a misleading health score."
    evidence_required: "Application/UI tests and bounded smoke prove workspace refresh plus repository listing shows local identity/path/type/branch/HEAD/dirty and GitHub/ref observation time/freshness/availability when available, while unavailable/unknown/conflict remains visible and no HEALTHY/BEHIND/AHEAD/DIVERGED projection is introduced."
  - id: AC-7
    requirement: "Repository observation is operationally read-only."
    evidence_required: "Command-boundary tests reject non-allowlisted mutating Git/gh operations; fixture snapshots before/after prove HEAD, refs, index, config, worktree files and remotes unchanged; exact source inspection finds no runtime mutation command path."
  - id: AC-8
    requirement: "Phase 3 slice preserves stack simplicity and verification quality."
    evidence_required: "No unnecessary runtime dependency/service/framework is introduced; fresh frozen-lockfile install and repository-owned pnpm verify PASS, plus bounded loopback smoke on 127.0.0.1."
  - id: AC-9
    requirement: "Execution lineage stays exact and Phase 3 scope does not leak forward."
    evidence_required: "Base-to-implementation diff contains only authorized repository-observation/UI/persistence/test/README changes, report is a report-only direct child, final topology is {main}, and no health/sync/environment/provider/task/agent/business/deployment behavior or external-repository mutation appears."

  - id: AC-10
    requirement: "Revision-3 recovery preserves exact local-candidate provenance and closes the reproduced mutable-fact reconciliation defect."
    evidence_required: "Executor preflight proves exact original base, recovery patch SHA-256 and 13-path set before mutation; regression proves dirty/remotes/branch/upstream/ahead-behind changes at unchanged HEAD do not create false CONFLICTED evidence while genuine immutable-version conflict semantics remain intact."

verification:
  executor_checks:
    - id: CHECK-0
      command_or_check: "Before any implementation mutation, prove local HEAD is the exact revision-3 handoff base, run the exact normative LC_ALL=C recovery-hash script defined in scope, recompute the authorized path set, and require exact match to 476dee24be553e5d21e8f572585e8aced435e1eda0fc97f3c99f5519b0e92cb1 plus the 13 authorized paths. Do not clean/reset/stash/adopt on mismatch."
      required: true
    - id: CHECK-1
      command_or_check: "Fresh-preflight exact TASK-0003/base/pinned authority, accepted TASK-0002 review, MAIN_ONLY topology, exact authorized dirty recovery candidate with no unrelated local drift, system git/gh read capability, package/test/build/runtime capability before mutation."
      required: true
    - id: CHECK-2
      command_or_check: "Build isolated temporary repository fixtures including ordinary dirs, normal repos, linked worktrees, dirty/detached states, nested-stop cases and symlink-cycle cases; snapshot HEAD/refs/index/config/files/remotes before observation and prove unchanged afterward."
      required: true
    - id: CHECK-3
      command_or_check: "Run deterministic fake/injected GitHub CLI contract tests covering stable repo identity, HTTPS/SSH alias normalization, default/relevant ref SHA, inaccessible/missing gh/auth/non-GitHub cases, and secret-free normalized results."
      required: true
    - id: CHECK-4
      command_or_check: "Run persistence/reconciliation tests for successful CURRENT observations followed by unavailable refresh retaining last-known STALE/UNKNOWN evidence, conflict preservation, stronger identity adoption and cache/reopen behavior."
      required: true
    - id: CHECK-5
      command_or_check: "Run UI/application tests for workspace repository refresh/listing and explicit unavailable/unknown/conflict rendering without repository-health classification."
      required: true
    - id: CHECK-6
      command_or_check: "Run fresh pnpm install --frozen-lockfile and pnpm verify with all type/test/build gates PASS, then bounded 127.0.0.1 runtime smoke using only run-owned temporary Argus data."
      required: true
    - id: CHECK-7
      command_or_check: "Inspect exact diff/source/dependencies for discovered-repository mutation commands, credential capture/logging, unnecessary SDK/dependency, runtime artifact leakage, background poller/watcher, health/sync/Phase4+ scope, and unauthorized artifact changes."
      required: true
    - id: CHECK-8
      command_or_check: "Publish exactly one implementation commit and one report-only direct child; re-resolve remote main, report parent/diff, task/report identities, clean local state, zero unauthorized branches/tags and topology exactly {main} before NEEDS_REVIEW."
      required: true
  authoritative_verification:
    required: false
    mechanism: ""
    expected_signal: ""

