structure_authority:
  status: RESOLVED
  source: "Argus accepted foundation through TASK-0002 plus TASK-0003 revision 1."
  rationale: >-
    Extend the existing single-package Next.js/local SQLite application with one bounded Phase 3 repository
    observation slice. Reuse the system Git and GitHub CLI capabilities behind narrow project-owned process
    boundaries; add no Git/GitHub npm SDK, service split, generic plugin registry, background worker, queue,
    daemon, or Phase 4+ module hierarchy. Source structure remains shallow and responsibility-oriented.

objective: >-
  Recover and complete the already-started first Phase 3 Git/repository-control slice without discarding or broadly
  rewriting the authorized local implementation produced under TASK-0003 revision 1. Adopt only the exact bounded
  local candidate identified by the recovery hash below, correct the reproduced mutable-local-fact reconciliation
  defect, finish every original verification gate, publish one implementation commit plus report-only child, and
  preserve the original read-only repository discovery/Git/GitHub observation boundary. Derived health/attention and
  Git mutation/sync actions remain deferred to later Phase 3 tasks.

scope:
  required_changes:
    - >-
      Revision-3 recovery may adopt exactly one pre-existing operator-local dirty implementation state: original
      execution base 2b5e3496a94f6ba2df6da8dbe015a67c6b1311d3 with combined tracked-diff/untracked-content SHA-256
      476dee24be553e5d21e8f572585e8aced435e1eda0fc97f3c99f5519b0e92cb1 and exactly these changed paths:
      app/globals.css, app/page.tsx, app/repositories/route.ts, src/persistence.ts, src/repositories.ts,
      src/repository-observations.ts, src/workspace-app.ts, src/workspace-home.tsx, src/workspace-store.ts,
      tests/application.test.tsx, tests/next-adapter.test.tsx, tests/repository-observation.test.ts, and
      tests/workspace.test.ts. Before any implementation mutation, recompute the canonical recovery hash using the exact normative script in the next requirement and
      exact path set on the revision-3 handoff checkout. Any mismatch is STALE_STATE/BLOCKED; do not reset, stash,
      discard, or silently adopt another dirty state.
    - >-
      Canonical recovery-hash serialization is normative. Execute the following exact POSIX-shell script from the
      Argus repository root before any implementation mutation. Its stdout is the authoritative recovery hash:
      `export LC_ALL=C; { git diff --binary; git ls-files --others --exclude-standard -z | sort -z | xargs -0 -I{} sh -c 'printf "FILE:%s\n" "$1"; cat "$1"' sh {}; } | shasum -a 256 | awk '{print $1}'`.
      The hashed input byte stream is therefore exactly: (1) stdout bytes from `git diff --binary` against current
      HEAD for tracked worktree changes; then (2) untracked repository-relative paths from
      `git ls-files --others --exclude-standard -z`, bytewise/NUL sorted under LC_ALL=C, each serialized as the bytes
      `FILE:` + exact path + newline followed immediately by that file's exact bytes, with no extra separator.
      For the authorized recovery candidate the command must output exactly
      476dee24be553e5d21e8f572585e8aced435e1eda0fc97f3c99f5519b0e92cb1.
    - >-
      Resolve the reproduced correctness defect before final verification: mutable local observations such as dirty
      state, remotes, branch/upstream and locally computed ahead/behind can change while HEAD is unchanged, so HEAD
      SHA must not be used as immutable source-version evidence for those mutable facts in a way that manufactures
      CONFLICTED reconciliation. Re-run the existing regression covering dirty-state change at the same HEAD, apply
      the smallest semantics-preserving correction, and require the regression plus the complete repository
      observation suite to pass. Preserve genuine same-immutable-version conflict behavior for facts where a strong
      immutable source version actually exists.
    - >-
      Discover Git repositories and linked worktrees reachable beneath configured active workspace roots using a
      bounded filesystem traversal that is safe against symlink cycles and does not descend into Git internals,
      dependency/build output, Argus runtime data, or another already-recognized repository working tree merely to
      find nested implementation directories. Ordinary non-Git directories remain ordinary workspace contents and
      must not be initialized, modified, or misclassified as repositories.
    - >-
      Recognize normal Git working trees and linked worktrees where `.git` is a file as well as a directory. Bare
      repositories may be represented as unsupported/observed when encountered but are not required to become
      Phase 3 controllable workspaces. Preserve the distinction between local worktree identity/path and canonical
      repository identity.
    - >-
      Use the existing system `git` executable as the local-Git observation mechanism. Only read-only inspection is
      authorized in TASK-0003: repository/worktree/common-dir identity, full HEAD SHA, symbolic branch or detached
      state, porcelain dirty state, configured remotes/upstream, and read-only ahead/behind evidence where locally
      provable. Do not invoke fetch, pull, merge, rebase, checkout/switch, reset, clean, stash, add, commit, push,
      remote mutation, gc, prune, worktree add/remove, config writes, hooks, or any command that intentionally
      mutates a discovered repository.
    - >-
      For a GitHub-hosted remote, normalize common HTTPS/SSH GitHub remote URL forms to owner/repository alias and
      use the already-installed/authenticated system `gh` CLI as the preferred live GitHub observation capability.
      Resolve the provider-issued immutable GitHub repository identity plus canonical name/default branch and the
      current remote ref SHA needed to compare the observed local branch/default branch. GitHub/gh unavailability,
      missing authentication, unsupported/non-GitHub remotes, deleted repositories, or inaccessible refs must be
      represented as explicit unavailable/unknown evidence rather than converted to healthy/current data.
    - >-
      Do not store or request a GitHub token in Argus. The `gh` subprocess owns its existing authentication
      mechanics; Argus receives only normalized non-secret command results/status. No credential value may enter
      SQLite, application logs, UI payloads, audit records, fixtures, exports, or repository artifacts.
    - >-
      Add the first EXTERNAL_DERIVED_TRUTH observation persistence needed for repository/Git facts. Every material
      persisted observation must bind a stable observation ID, canonical source identity, canonical subject identity
      when known, observation kind/value or explicit absence, observed_at, availability, freshness, source version
      evidence when available, and provenance sufficient to identify the Git/gh capability that produced it.
      Existing APP_NATIVE_TRUTH workspace/audit/recovery ownership must remain separate.
    - >-
      Use an explicit on-demand refresh freshness policy for this Phase 3 slice: facts acquired successfully in the
      current scan/refresh are CURRENT for that result; when a later refresh cannot re-observe an external source,
      retained last-known external values remain visible but are STALE or freshness-UNKNOWN with current availability
      UNAVAILABLE/UNKNOWN. Argus must not run a background poller or pretend an old persisted GitHub ref is CURRENT.
    - >-
      Reconciliation must compare only matching canonical source/subject/observation kinds, retain attributable
      prior evidence, prefer stronger immutable GitHub/source identity/version evidence, and surface contradictory
      evidence as CONFLICTED/explicit conflict evidence rather than silently overwriting it. Source failure must not
      replace the last successful value with fabricated null/fresh data.
    - >-
      Persist enough repository-index linkage to reconnect a discovered local worktree path and its workspace to the
      stronger immutable GitHub repository identity when available. A filesystem path, display name, remote URL,
      owner/name alias, mutable branch name, or local tracking ref alone must never replace the stronger provider ID
      as canonical repository identity once that stronger identity is known.
    - >-
      Extend the existing local UI minimally so an operator can trigger a workspace repository refresh and inspect
      discovered repositories. For each observed repository show at least canonical/display identity, local path,
      worktree/normal classification, current branch or detached state, local HEAD, dirty state, configured GitHub
      alias/remote when available, live remote/default or relevant branch SHA when available, observation time, and
      availability/freshness. Show explicit unavailable/unknown/conflict states rather than hiding the repository.
    - >-
      Do not derive the Phase 3 product health taxonomy (`HEALTHY`, `LOCAL_BEHIND`, `LOCAL_AHEAD`, `DIVERGED`, etc.)
      in this task. Raw normalized observations and freshness/availability/conflict evidence are the authorized output;
      deterministic repository health/attention projection is a separate next Phase 3 task.
    - >-
      Add deterministic tests using temporary Git repositories/worktrees and fake/injected process results for
      GitHub CLI boundaries. Tests must cover normal repository discovery, linked worktree discovery, ordinary
      directory rejection, symlink-cycle safety, clean/dirty/detached local observation, GitHub identity/ref
      normalization, unavailable GitHub, stale last-known preservation, and no discovered-repository mutation.
      Live GitHub may be used only as an additional bounded smoke against Argus itself, never as the sole contract proof.
    - >-
      Preserve the existing Node 24/pnpm/Next.js/SQLite stack and repository-owned `pnpm verify`; add no new runtime
      dependency unless an acceptance criterion is impossible with the standard library, current dependencies,
      system git, and system gh. Fresh `pnpm install --frozen-lockfile` plus `pnpm verify` must pass.
    - >-
      Publish one implementation commit and one canonical TASK-0003 report-only direct child on main, preserve
      MAIN_ONLY topology exactly {main}, and stop at NEEDS_REVIEW.
  allowed_existing_files_or_components:
    - app
    - src
    - tests
    - package.json
    - pnpm-lock.yaml
    - README.md
  expected_files_are_restrictive: false

invariants:
  - "Revision-3 recovery may adopt only the exact dirty TASK-0003 candidate hash 476dee24be553e5d21e8f572585e8aced435e1eda0fc97f3c99f5519b0e92cb1 over the exact 13 authorized changed paths; mismatch fails closed and no local state is discarded."
  - "Mutable local Git facts must not be treated as conflicting immutable-version evidence merely because HEAD is unchanged across observations."
  - "GitHub remote evidence remains canonical for GitHub-hosted repository refs/objects; Argus stores observations/indexes only."
  - "Local Git/workspace state is operator-owned execution evidence and must never be reset, cleaned, stashed, checked out, fetched, pulled, committed, pushed, or otherwise mutated by TASK-0003."
  - "Repository identity prefers provider-issued immutable GitHub identity when available; filesystem path and owner/name/URL remain aliases or local metadata."
  - "Observation availability, freshness, conflict, local Git state, GitHub state, authority, capability, and future health remain distinct facts."
  - "Every persisted external repository/Git fact has deterministic identity, provenance, observed_at, and explicit availability/freshness semantics."
  - "Failed refresh preserves attributable last-known evidence but never presents it as freshly observed GitHub truth."
  - "No secret value is requested from gh, persisted, logged, rendered, exported, or added to repository artifacts."
  - "Repository discovery/observation must be bounded and must not recursively consume Git internals, dependency/build trees, symlink cycles, or nested directories inside an already-recognized repository working tree."
  - "TASK-0003 exposes raw normalized repository/Git observations only; repository health/attention and mutation/sync actions remain unimplemented."
  - "No Phase 4 environment/Keychain/provider-resource behavior, Phase 6 authority projection, agent execution, or business workflow is introduced."

forbidden_changes:
  - "Do not create dev, staging, feature, temporary, backup, or review branches."
  - "Do not modify accepted TASK-0001/TASK-0002 task/report/review artifacts."
  - "Do not invoke or implement Git fetch/pull/merge/rebase/checkout/switch/reset/clean/stash/add/commit/push/config-write/remote-write/gc/prune or worktree mutation against discovered operator repositories."
  - "Do not add GitHub/octokit/isomorphic-git/simple-git or another Git/GitHub npm SDK when system git/gh plus narrow project-owned adapters satisfy the task."
  - "Do not add background polling, filesystem watchers, cron/scheduler, queue/worker, daemon/autostart, plugin registry, generic orchestration, WebSocket/event bus, or cloud service."
  - "Do not store GitHub credentials or implement Keychain/environment secret management."
  - "Do not implement repository health/attention classification, safe-sync actions, remote mutation, task/authority projection, providers/resources, SF/client/business features, analytics, templates, or controlled mutations."
  - "Do not add Docker/Compose, CI/GitHub Actions, Vercel/deployment configuration, release/tag automation, or mutate another repository."

