acceptance_criteria:
  - id: AC-1
    requirement: "Production Git observation cannot perform Git's optional index/stat-cache refresh writes."
    evidence_required: "A causal stale-stat fixture proves the production observation boundary leaves `.git/index` byte-for-byte unchanged; source inspection proves every production Git subprocess uses GIT_OPTIONAL_LOCKS=0 or an exactly equivalent mechanism."
  - id: AC-2
    requirement: "Local source-version evidence is semantically scoped."
    evidence_required: "Tests prove git.head stores exact full HEAD SHA as source_version while dirty/remotes/branch/detached/upstream/ahead-behind and mutable local/path facts do not use HEAD as their immutable source version."
  - id: AC-3
    requirement: "Conflict and mutable-refresh semantics remain correct."
    evidence_required: "Dirty changes at unchanged HEAD refresh normally with conflict NONE, while the existing explicit same-immutable-version contradictory fixture remains CONFLICTED."
  - id: AC-4
    requirement: "README accurately describes the current implemented phase boundary."
    evidence_required: "Exact README inspection states Phase 2 foundation plus Phase 3 read-only discovery/observation and explicitly excludes health/attention and Git sync/mutation plus later Phase 4+ surfaces."
  - id: AC-5
    requirement: "The existing Phase 3 slice remains fully verified and scope-stable."
    evidence_required: "Fresh frozen install, full pnpm verify, production loopback smoke, repository-observation/UI evidence and CHECK-7 scope/secret/dependency inspection PASS with no changes outside the authorized correction files."
  - id: AC-6
    requirement: "Correction lineage is exact and reconstructible."
    evidence_required: "Correction implementation is the sole direct child of exact revision-4 base; report revision 2 is its report-only child; final remote/local main match, topology is {main}, task/report identities are exact, working tree is clean and no unauthorized tag/release/external mutation exists."

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "Fresh-preflight exact TASK-0003 revision 4/base/task blob, prior REVISION_REQUIRED review identity, MAIN_ONLY topology, clean synchronized local state and all current execution capabilities before mutation."
      required: true
    - id: CHECK-2
      command_or_check: "Reproduce/characterize the stale-stat git-status optional index write in an isolated fixture, then run the production observer after correction and prove exact index/HEAD/refs/config/files/remotes invariance."
      required: true
    - id: CHECK-3
      command_or_check: "Run focused source-version/conflict tests proving git.head strong version evidence, mutable facts null/non-immutable version evidence, same-HEAD dirty refresh without false conflict, and preserved genuine immutable conflict behavior."
      required: true
    - id: CHECK-4
      command_or_check: "Run the complete repository-observation/application/Next-adapter/workspace test suite and inspect README current-phase wording."
      required: true
    - id: CHECK-5
      command_or_check: "Run fresh pnpm install --frozen-lockfile and pnpm verify with typecheck/all tests/production build PASS, then bounded 127.0.0.1 production smoke using only run-owned temporary Argus data and clean it safely."
      required: true
    - id: CHECK-6
      command_or_check: "Inspect exact base-to-correction diff, source subprocess environments, dependencies, secrets, runtime artifacts and forward-scope terms; require only the authorized four implementation/docs files before report publication."
      required: true
    - id: CHECK-7
      command_or_check: "Publish exactly one correction implementation commit plus one report-revision-2-only child; re-resolve final remote main, parent/diffs, task/report blobs, review preservation, clean local state, zero tags and topology exactly {main}."
      required: true
  authoritative_verification:
    required: false
    mechanism: ""
    expected_signal: ""

