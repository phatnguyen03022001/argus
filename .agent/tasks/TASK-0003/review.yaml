gap_disposition:
  - gap_id: GIT_STATUS_OPTIONAL_INDEX_WRITE
    decision: revise_current_task
    rationale: >-
      Independent review reproduced a discovered-repository mutation that the implementation tests did not expose.
      After changing only a tracked file mtime, plain `git status --porcelain=v1 --untracked-files=normal` changed
      the SHA-256 of `.git/index`, while the same command with `GIT_OPTIONAL_LOCKS=0` left the index unchanged.
      TASK-0003 requires observation to be operationally read-only and forbids mutation of operator repositories,
      so AC-7 is not satisfied until every runtime Git observation executes with optional Git writes disabled and a
      regression proves stale-stat/index cases remain byte-for-byte invariant.
  - gap_id: LOCAL_HEAD_SOURCE_VERSION_EVIDENCE
    decision: revise_current_task
    rationale: >-
      The false-conflict correction sets sourceVersion=null for every local Git observation. That is appropriate for
      mutable worktree/config facts, but `git.head` has exact immutable commit SHA evidence available. TASK-0003
      requires source-version evidence when available and AC-4 requires provenance/version evidence. The correction
      should assign strong version evidence only to facts for which that version semantically governs the observed
      value, without reintroducing HEAD as a version for dirty/remotes/branch/upstream/ahead-behind.
  - gap_id: README_PHASE3_DISCOVERY_STATE
    decision: revise_current_task
    rationale: >-
      The repository entrypoint still presents the current product as Phase-2-only and says Git/GitHub discovery is
      not performed. After TASK-0003 implementation those statements are materially stale for an operator following
      the README. Update only the current-capability/phase-boundary wording; do not expand product scope or redesign
      canonical docs.

