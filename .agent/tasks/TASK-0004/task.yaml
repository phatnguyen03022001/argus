structure_authority:
  status: RESOLVED
  source: >-
    Preserve the existing single-package Next.js/TypeScript application. Derived repository assessment is a local
    domain projection over the existing RepositoryView/observation surface and may use the smallest local src/test/UI
    structure needed. No new top-level ownership boundary, package, service, schema, dependency, adapter framework,
    background process, or shared infrastructure abstraction is authorized.

objective: >-
  Complete the next bounded Phase 3 slice by deriving explainable repository health, sync condition, and attention
  from the accepted current local-Git/GitHub observations, then surface the result in the existing local UI. The
  projection must be deterministic, recomputable, reason-coded, provenance/freshness-aware, and non-authoritative.
  It must not persist health as source truth and must not perform or authorize Git mutation/synchronization.

scope:
  required_changes:
    - >-
      Add a deterministic repository assessment projection over the existing RepositoryView/raw observation model.
      The projection exposes: `health` in {HEALTHY, DEGRADED, UNKNOWN}; `attention` in
      {BLOCKING, ACTION_REQUIRED, DEGRADED, INFO, HEALTHY}; a `sync_condition` in
      {IN_SYNC, LOCAL_AHEAD, LOCAL_BEHIND, DIVERGED, MISMATCH_UNCLASSIFIED, UNKNOWN}; a stable ordered list of
      reason codes; and enough input identity/freshness/availability/conflict summary for the UI to explain the result.
    - >-
      Apply fail-closed evidence precedence. Any required conflicting observation prevents HEALTHY and yields
      BLOCKING attention. Required unavailable/unknown evidence yields UNKNOWN health with at least DEGRADED attention;
      stale required evidence yields DEGRADED health even when a last-known value is present. Do not rewrite stale or
      unavailable evidence as current merely to classify the repository.
    - >-
      When local and GitHub ref evidence are current/available/non-conflicted, derive sync condition without network
      mutation: equal local HEAD/ref SHA => IN_SYNC; ahead>0/behind=0 => LOCAL_AHEAD; ahead=0/behind>0 => LOCAL_BEHIND;
      ahead>0/behind>0 => DIVERGED; unequal HEAD/ref SHA without trustworthy relation counts => MISMATCH_UNCLASSIFIED.
      Missing required comparison evidence => UNKNOWN. Do not infer branch policy beyond the ref that TASK-0003 already observes.
    - >-
      Derive operator attention from the same inspectable facts. DIRTY_WORKTREE and DETACHED_HEAD are ACTION_REQUIRED;
      LOCAL_AHEAD and LOCAL_BEHIND are ACTION_REQUIRED; DIVERGED and observation conflict are BLOCKING;
      unavailable/unknown/stale required evidence is at least DEGRADED; NO_UPSTREAM may be INFO when stronger evidence
      still proves the current observed ref is IN_SYNC. Multiple reasons are preserved and deterministically ordered;
      the highest-severity condition controls the attention value.
    - >-
      HEALTHY is permitted only when required local/GitHub/ref evidence is available, current, non-conflicted, the
      worktree is clean and attached, and sync condition is IN_SYNC. A repository may remain HEALTHY with INFO-level
      non-blocking reasons such as NO_UPSTREAM only when the remote-ref comparison itself is current and exact.
    - >-
      Integrate assessments into the existing operator UI. Add a compact "Needs attention" view ordered first by
      attention severity and then deterministic repository identity/path, plus per-repository health/sync/attention
      and reason-code explanation. Preserve access to the existing raw Git/GitHub evidence and timestamps instead of
      replacing it with opaque badges or a numeric score.
    - >-
      Keep health/attention ephemeral and recomputed from current observations. Do not add persistence tables/columns,
      migrations, background polling, hidden queues, audit events for pure projection, or cached health as canonical truth.
    - >-
      Add deterministic domain/UI tests covering at least healthy/in-sync, dirty, detached, local-ahead, local-behind,
      diverged, unequal-unclassified, stale, unavailable/unknown, conflict precedence, multi-reason severity ordering,
      and the allowed HEALTHY+INFO no-upstream case. Existing TASK-0003 no-mutation/provenance tests must remain green.
    - >-
      Run fresh frozen-lockfile install, repository-owned `pnpm verify`, bounded production loopback smoke using only
      run-owned temporary Argus data, exact diff/dependency/schema/secret/forward-scope inspection, publish exactly one
      implementation commit plus one report-only direct child on main, and stop at NEEDS_REVIEW.

  allowed_existing_files_or_components:
    - existing repository observation/domain projection surface under src/
    - existing workspace/repository application view surface under src/ and app/
    - existing test suite under tests/
    - README.md only if current capability wording becomes materially stale after this slice
    - .agent/tasks/TASK-0004/report.yaml
  expected_files_are_restrictive: false

invariants:
  - "GitHub remote main remains canonical repository truth and target topology remains exactly {main}."
  - "Health, sync condition, attention, and reason codes are derived projections, never external or app-native source truth."
  - "Every HEALTHY result is explainable from current available non-conflicted required observations."
  - "No stale, unavailable, unknown, or conflicted required evidence may be hidden behind an optimistic healthy state."
  - "No numeric health score, probabilistic confidence score, hidden magic weighting, or persisted current-health snapshot is introduced."
  - "No production Git/GitHub observation or derived-health path mutates discovered repositories, refs, index, config, worktree, remotes, or GitHub state."
  - "No Git sync/mutation action, environment/Keychain capability, provider/resource integration, task/agent/business capability, background poller, branch, tag, release, workflow, or deployment is introduced."
  - "No secret value enters persistence, logs, UI, tests, reports, or repository artifacts."

forbidden_changes:
  - "Do not implement fetch/pull/merge/rebase/reset/clean/stash/checkout/switch/push or any repository synchronization/mutation control."
  - "Do not add a database migration/schema field for health, attention, sync condition, or derived reason codes."
  - "Do not add dependencies, packages, services, queues, workers, watchers, plugin registries, policy engines, scoring engines, or generic rule DSLs."
  - "Do not infer repository branch policy, desired branch, deployment environment, task authority, or product state not present in current observations."
  - "Do not implement Phase 4+ environment/secrets or any later milestone surface."
  - "Do not create branches/tags/releases/workflows or mutate another repository."

gap_policy:
  local_auto_fix: true
  scope_expansion: forbidden
  architecture_change: forbidden
  spec_change: forbidden
  dependency_change: forbidden
  public_contract_change: forbidden
  blocking_gap_behavior: BLOCKED

continuation_policy:
  mode: MANUAL
  stop_conditions:
