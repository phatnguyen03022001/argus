    - filesystem_test_fixture_execution
    - git_read_observation
    - github_cli_read_observation
    - package_install
    - test_execution
    - production_build_execution
    - loopback_runtime_smoke
    - exact_diff_inspection

acceptance_criteria:
  - id: AC-1
    requirement: "Repository health/attention is deterministic, explainable, and non-authoritative."
    evidence_required: >-
      Pure/domain tests prove exact health/attention/sync/reason outputs from fixed RepositoryView inputs; source
      inspection proves the projection performs no persistence or external command/API side effect.
  - id: AC-2
    requirement: "Required evidence degradation propagates fail-closed."
    evidence_required: >-
      Tests prove conflict => BLOCKING/non-healthy, unavailable/unknown => UNKNOWN/non-healthy, stale => DEGRADED, and
      no combination of degraded required inputs yields HEALTHY.
  - id: AC-3
    requirement: "Sync condition classification is exact and does not invent branch policy."
    evidence_required: >-
      Matrix tests prove IN_SYNC, LOCAL_AHEAD, LOCAL_BEHIND, DIVERGED, MISMATCH_UNCLASSIFIED, and UNKNOWN from the
      current observed local HEAD/GitHub ref/relation inputs only.
  - id: AC-4
    requirement: "Attention severity and reason ordering are stable and useful to the operator."
    evidence_required: >-
      Tests prove dirty/detached/ahead/behind/diverged/conflict/stale/unavailable/no-upstream semantics, multi-reason
      highest-severity selection, deterministic reason ordering, and HEALTHY+INFO only for the explicitly allowed
      no-upstream/in-sync case.
  - id: AC-5
    requirement: "UI answers what needs attention without hiding raw evidence."
    evidence_required: >-
      UI tests/render evidence show Needs attention ordering plus per-repository health/sync/attention/reasons while
      raw local/GitHub evidence, freshness/availability/conflict and timestamps remain inspectable.
  - id: AC-6
    requirement: "TASK-0003 operationally read-only guarantees remain intact."
    evidence_required: >-
      Existing repository observation invariance/provenance tests remain green; exact diff/source inspection finds no
      Git/GitHub mutation command, observation weakening, schema/dependency expansion, secret surface, or Phase 4+ behavior.
  - id: AC-7
    requirement: "Implementation and report lineage are exact and reproducible."
    evidence_required: >-
      Fresh frozen install, full pnpm verify, bounded production loopback smoke and hygiene PASS; implementation is one
      direct child of exact task base, report is its report-only child, final local/remote main match, topology is
      exactly {main}, and task/report identities are exact.

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "Fresh-preflight exact TASK-0004 revision/base/task blob, accepted TASK-0003 review identity, MAIN_ONLY topology, clean synchronized local state, and current required capabilities before mutation."
      required: true
    - id: CHECK-2
      command_or_check: "Run deterministic repository-assessment matrix tests for health, attention, sync condition, reason precedence/order, and degraded evidence propagation."
      required: true
    - id: CHECK-3
      command_or_check: "Run UI/render tests proving Needs attention ordering and explainable per-repository assessment without losing raw observation evidence."
      required: true
    - id: CHECK-4
      command_or_check: "Run existing TASK-0003 repository no-mutation/provenance/reconciliation regression coverage unchanged or stronger."
      required: true
    - id: CHECK-5
      command_or_check: "Run fresh pnpm install --frozen-lockfile and repository-owned pnpm verify under the repository-pinned Node/pnpm versions, then bounded 127.0.0.1 production smoke using run-owned temporary Argus data and clean it safely."
      required: true
    - id: CHECK-6
      command_or_check: "Inspect exact implementation diff, schema/migrations, dependencies, production Git/GitHub subprocess/API boundaries, secrets, runtime artifacts and forward-scope terms; require no unauthorized mutation or Phase 4+ expansion."
      required: true
    - id: CHECK-7
      command_or_check: "Publish exactly one implementation commit plus one report-only child; re-resolve final remote main, parent/diffs, task/report blobs, clean local state, zero tags and topology exactly {main}."
      required: true
  authoritative_verification:
    required: false
    mechanism: ""
    expected_signal: ""

