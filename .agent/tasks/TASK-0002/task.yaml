structure_authority:
  status: RESOLVED
  source: "Argus Vision Lock at c1ef12dd75eedb5a31c7ad75d65f92d9403d2800 plus TASK-0002 revision 1."
  rationale: >-
    Phase 2 introduces the first runtime implementation. Use one repository-root, single-package local
    TypeScript web application and the shallowest conventional Next.js structure. New source/config/migration
    files needed by that one application are authorized. Do not create a monorepo, apps/packages split,
    generic core/application/infrastructure layer hierarchy, plugin registry, daemon, worker, service split,
    reusable SDK, or Phase 3+ ownership area.

objective: >-
  Implement the smallest usable Argus Phase 2 local workspace foundation: one local-only UI/runtime,
  durable Argus-owned workspace metadata with stable identity and migration/recovery semantics, a bounded
  audit trail, and one repository-owned verifier. The operator must be able to start Argus locally, add an
  existing filesystem workspace root, restart Argus, and still see that same workspace identity. Stop before
  Git repository discovery/control or any Phase 3+ behavior.

scope:
  required_changes:
    - >-
      Establish exactly one local application stack: Node.js 24 LTS, TypeScript, pnpm 11, Next.js 16.3.3
      App Router with its compatible stable React peer line, and Vitest 4.1.x for deterministic tests.
      Pin concrete dependency versions in the lockfile/package metadata. Do not add another web/backend
      framework, desktop wrapper, ORM, DI framework, state-management framework, styling framework, or test runner.
    - >-
      Use SQLite as the local durable store through better-sqlite3 13.0.3 with direct project-owned SQL and
      migrations; do not add an ORM or remote/libSQL database. Store runtime data outside the Git repository
      under the conventional macOS Application Support location for Argus. Tests may inject an isolated
      temporary data root without changing production ownership semantics.
    - >-
      Implement schema-versioned local persistence and an explicit migration runner sufficient for the initial
      schema and future forward migrations. A migration failure must not silently mark the target schema active.
      The store must be reopenable deterministically and reject unsupported/invalid schema state rather than
      pretending success.
    - >-
      Implement the Phase 2 app-native workspace record with an immutable Argus-issued record identity,
      operator-visible label, canonicalized/realpath filesystem root as mutable metadata, lifecycle timestamps,
      and active/archived lifecycle semantics if removal is needed. Filesystem path must never become the record
      primary identity. Prevent duplicate active records for the same canonical filesystem root.
    - >-
      Validate workspace roots before persistence: the input must resolve to an absolute existing directory.
      Resolve symlinks/relative forms to canonical realpath for comparison, report validation failures clearly,
      and never scan, reset, modify, delete, or initialize the selected directory in Phase 2.
    - >-
      Implement a bounded APP_NATIVE_TRUTH audit journal for operator-significant workspace mutations and data
      recovery operations. Records must include time, actor category, operation, deterministic target identity,
      outcome/reason and relevant pre/post record identity/version when applicable. The audit shape must contain
      no secret-value field and must not duplicate external truth.
    - >-
      Implement a minimal versioned export/restore capability for the Phase 2 Argus-owned state sufficient to
      recover workspace records, audit evidence, and schema/integrity metadata. Restore must validate version,
      identities and relationships before activation; invalid restore input must leave the current valid store
      untouched. No cloud/off-device backup or background backup scheduler is authorized.
    - >-
      Provide a minimal local UI that is immediately usable: an Argus shell/home surface that lists configured
      workspace roots and allows the operator to add an existing workspace root. Surface empty state and
      validation errors clearly. This task does not require visual-polish redesign, command palette, global
      search, repository cards, Git health, environment/provider/task/client surfaces, or analytics.
    - >-
      Bind the application server to loopback only for normal local operation. It must not intentionally listen
      on all interfaces, expose a remote/cloud control plane, add authentication/multi-user semantics, or create
      an always-on daemon/autostart service.
    - >-
      Keep application capability semantics transport-independent inside the implementation: UI/server transport
      mechanics must not become the workspace domain contract. Use direct narrow modules for the concrete
      responsibilities actually present (workspace state, persistence/recovery, audit) rather than speculative
      adapter/factory/registry layers.
    - >-
      Add concise README local-run instructions and one repository-owned `pnpm verify` path covering static/type
      checks, deterministic tests and production build. Keep developer setup local and secret-free; no `.env`
      file or secret configuration is required for Phase 2.
    - >-
      Publish one bounded implementation commit and one canonical TASK-0002 report-only direct child on main,
      preserve MAIN_ONLY topology exactly {main}, and stop at NEEDS_REVIEW.
  allowed_existing_files_or_components:
    - README.md
    - docs/PRODUCT.md
    - docs/BEHAVIOR.md
    - docs/ARCHITECTURE.md
    - docs/DATA.md
    - docs/INTERFACES.md
    - docs/QUALITY.md
    - docs/DELIVERY.md
    - docs/DECISIONS.md
  expected_files_are_restrictive: false

invariants:
  - "GitHub remote main remains canonical repository truth; local /Users/tienphat/Developer/argus is an execution copy."
  - "Argus remains one local process/deployable in Phase 2; no service split, daemon, worker, queue, cloud control plane, or monorepo is introduced."
  - "Workspace record identity is immutable and independent from filesystem path/display label; path changes never manufacture a new identity implicitly."
  - "Phase 2 may persist only Argus-owned workspace/audit/recovery state plus implementation metadata; it does not persist Git/provider/task observations yet."
  - "Runtime SQLite data and exports are not stored in or committed to the Argus repository."
  - "No secret value is required, stored, logged, exported, restored, or exposed by Phase 2."
  - "Invalid/missing workspace paths, duplicate active roots, schema mismatch, migration failure, or invalid restore fail closed without corrupting current valid state."
  - "The UI is a local adapter over the same workspace semantics; UI framework mechanics do not become domain authority."
  - "Phase 2 performs no Git repository discovery, Git command execution, remote GitHub observation, environment/secret integration, provider integration, task projection, agent execution, or business workflow."
  - "No Phase 3+ feature may be added merely because the selected stack makes it easy."

forbidden_changes:
  - "Do not create dev, staging, feature, temporary, backup, or review branches."
  - "Do not mutate TASK-0001 artifacts or rewrite accepted Phase 0/1 semantics."
  - "Do not add Tauri/Electron/native desktop packaging, NestJS/Express/Fastify or another backend, an ORM, libSQL/Turso, PostgreSQL, Redis, queue/worker, Docker/Compose, MCP server, agent framework, provider SDK, or cloud deployment configuration."
  - "Do not add Tailwind, component libraries, global client-state libraries, DI containers, generic plugin/adapter registries, or clean-architecture layer scaffolding for hypothetical future consumers."
  - "Do not recursively discover repositories or execute Git/GitHub commands from the Argus runtime in this task."
  - "Do not read or migrate existing .env files, access macOS Keychain, or implement environment/provider functionality."
  - "Do not write into selected workspace roots; Phase 2 only validates and records the root metadata."
  - "Do not implement command palette/search, task/authority projection, Agent Runtime/Codex integration, SF/client/opportunity/requirement flows, controlled external mutation, analytics, templates, or Phase 3+ functionality."
  - "Do not add CI/GitHub Actions or release/tag/repository-metadata automation."
  - "Do not mutate architect-profile, agent-skills, agent-documents, agent-standards, agent-runtime, SF, or any external repository."

