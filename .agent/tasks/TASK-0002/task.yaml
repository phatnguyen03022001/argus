      Re-inspect the original base-to-candidate diff and dependency closure to prove the revision-1 Phase 2
      acceptance boundary remains satisfied: one local Next.js/TypeScript application, durable workspace
      metadata, migrations/recovery/audit/UI, loopback-only operation, and no Git/GitHub runtime control,
      secrets/provider/task/business/Phase 3+ behavior, forbidden framework, runtime database leakage, or
      unrelated external mutation.
    - >-
      Publish exactly one new .agent/tasks/TASK-0002/report.yaml as Executor-owned evidence. The report must
      clearly distinguish the immutable Phase 2 implementation candidate from this revision-2 evidence-recovery
      execution. Its execution.final_execution_head is the revision-2 handoff base because revision 2 performs
      no implementation mutation; acceptance evidence must separately bind the preserved implementation candidate
      7b527edc3f9a154b18378e2e473faf6aa2c369d7 and original base.
    - >-
      Commit and push exactly one report-only direct child of the revision-2 handoff base, re-resolve remote main,
      report parent/diff, task/report identity and topology exactly {main}, then stop at NEEDS_REVIEW.
