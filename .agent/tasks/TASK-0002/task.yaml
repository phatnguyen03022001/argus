acceptance_criteria:
  - id: AC-1
    requirement: "The Phase 2 runtime is one reproducible local TypeScript/Next.js application using the authorized dependency boundary only."
    evidence_required: "Pinned package/lock/runtime metadata show Node 24 LTS, pnpm 11, Next.js 16.3.3, compatible React peers, better-sqlite3 13.0.3 and Vitest 4.1.x; no forbidden framework/dependency/topology appears."
  - id: AC-2
    requirement: "Argus starts as a loopback-only local application and renders a usable workspace home surface."
    evidence_required: "Fresh production/dev smoke proves the app responds on 127.0.0.1, the home UI renders configured/empty workspace state, and normal startup does not intentionally bind a wildcard external interface."
  - id: AC-3
    requirement: "Workspace identity and path semantics preserve the frozen deterministic-identity boundary."
    evidence_required: "Tests prove immutable Argus-issued workspace ID, canonical realpath metadata, duplicate-root rejection, invalid/non-directory rejection, and identity preservation when mutable metadata changes."
  - id: AC-4
    requirement: "Workspace state is durable outside the repository and survives application/store reopen."
    evidence_required: "Integration evidence using an isolated data root creates a workspace, closes/reopens the store/process boundary, and resolves the same record identity and metadata; repository diff contains no runtime database."
  - id: AC-5
    requirement: "Schema versioning and migration failure semantics are deterministic and fail closed."
    evidence_required: "Tests cover initial migration, known-version reopen, unsupported schema rejection, and a failing migration/recovery fixture proving invalid target schema is not activated over the prior valid state."
  - id: AC-6
    requirement: "Phase 2 app-native export/restore is versioned, validated and non-destructive on invalid input."
    evidence_required: "Round-trip tests export workspace/audit/schema state, restore into an isolated store and prove identities/relationships; malformed or unsupported restore is rejected while the prior valid store remains readable."
  - id: AC-7
    requirement: "Workspace mutations produce bounded secret-free audit evidence."
    evidence_required: "Tests prove successful and rejected material workspace/recovery operations record required identity/time/outcome/reason semantics without secret-value payload fields."
  - id: AC-8
    requirement: "The UI can add and list an existing workspace without mutating the selected directory."
    evidence_required: "Focused application/UI evidence proves a valid temporary directory can be submitted and then rendered from persisted state, while invalid/duplicate input yields a clear failure and selected workspace contents remain unchanged."
  - id: AC-9
    requirement: "Phase 2 remains strictly before Git/repository control."
    evidence_required: "Exact source/diff inspection proves no runtime Git/GitHub discovery or command execution, no repository health model, and no Phase 3+ feature/dependency was introduced."
  - id: AC-10
    requirement: "The repository has one deterministic local verification path."
    evidence_required: "Fresh `pnpm install --frozen-lockfile` and `pnpm verify` succeed on the exact implementation SHA; verification includes type/static checks, deterministic tests, and production build."
  - id: AC-11
    requirement: "Execution lineage and repository topology remain exact."
    evidence_required: "Implementation is a direct child of the authorized base, report is a report-only direct child, final remote topology is exactly {main}, and no branch/tag/release/CI/external-repository mutation occurred."

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "Preflight exact task/base/pinned authority, remote main identity, clean local execution copy, Node/package/native-build capability, and MAIN_ONLY topology before mutation."
      required: true
    - id: CHECK-2
      command_or_check: "Install exactly from the committed lockfile and inspect dependency closure for forbidden or unexpected runtime/framework additions."
      required: true
    - id: CHECK-3
      command_or_check: "Run focused deterministic workspace identity/path validation, persistence reopen, schema migration failure, export/restore, and audit tests against isolated temporary data/workspace roots."
      required: true
    - id: CHECK-4
      command_or_check: "Run focused UI/application smoke proving valid add/list plus invalid/duplicate handling without modifying selected workspace contents."
      required: true
    - id: CHECK-5
      command_or_check: "Run the repository-owned `pnpm verify` on the exact implementation candidate and require all included static/type/test/build gates PASS with no skips."
      required: true
    - id: CHECK-6
      command_or_check: "Start the exact candidate locally and prove loopback response on 127.0.0.1 plus clean bounded process shutdown; do not create an autostart/daemon."
      required: true
    - id: CHECK-7
      command_or_check: "Inspect exact base-to-implementation diff for runtime DB/export leakage, .env/secret material, runtime Git/GitHub execution, forbidden dependencies/topology, Phase 3+ behavior, README accuracy, and unauthorized docs/task changes."
      required: true
    - id: CHECK-8
      command_or_check: "Publish one implementation commit plus one report-only direct child, then re-resolve final remote main, task/report identity and topology exactly {main} before NEEDS_REVIEW."
      required: true
  authoritative_verification:
    required: false
    mechanism: ""
    expected_signal: ""

