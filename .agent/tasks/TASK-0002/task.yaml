      Treat 7b527edc3f9a154b18378e2e473faf6aa2c369d7 as immutable existing Phase 2 implementation evidence.
      Do not amend, rebuild into a new implementation commit, reformat, or otherwise modify its product bytes.
    - >-
      Re-run sufficient deterministic evidence on the unchanged Phase 2 code to make the recovered report
      self-sufficient across sessions: frozen-lockfile installation, repository-owned pnpm verify, focused
      workspace/persistence/migration/export-restore/audit/UI evidence, and bounded loopback runtime smoke.
      Tests may use isolated temporary data/workspace roots and must satisfy the existing local-hygiene contract.
