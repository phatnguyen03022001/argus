    - exact_diff_inspection

acceptance_criteria:
  - id: AC-1
    requirement: "GitHub-canonical local-vs-remote relation is normalized deterministically without local Git mutation."
    evidence_required: >-
      Adapter/fixture tests prove IDENTICAL, LOCAL_AHEAD, LOCAL_BEHIND, DIVERGED and UNKNOWN normalization from exact
      GitHub read responses; malformed/unavailable cases fail closed and production source contains no Git mutation.
  - id: AC-2
    requirement: "Relation evidence has exact identity, provenance and freshness semantics."
    evidence_required: >-
      Persistence/reopen tests prove exact repository/ref/local-SHA/remote-SHA binding, provenance, observed/checked
      time, availability/freshness and immutable input-pair/source-version semantics without creating a parallel truth model.
  - id: AC-3
    requirement: "Repository assessment prefers stronger current canonical relation evidence without hiding degradation."
    evidence_required: >-
      Matrix tests prove a fresh GitHub relation correctly classifies actual behind/ahead/diverged state even when local
      remote-tracking counts are stale, while conflict/stale/unavailable/identity failures remain non-healthy/unknown.
  - id: AC-4
    requirement: "Safe fast-forward preview is exact, fail-closed and non-authoritative."
    evidence_required: >-
      Pure tests prove ELIGIBLE only for clean attached exact LOCAL_BEHIND state and expose exact expected pre-head and
      target SHA; all dirty/detached/ahead/diverged/stale/unavailable/conflicted/mismatched cases are BLOCKED/UNKNOWN and
      no preview performs an external side effect or grants authority.
  - id: AC-5
    requirement: "UI explains relation and future-sync eligibility without offering mutation."
    evidence_required: >-
      UI tests/render evidence show relation, preview state/reasons and exact SHAs alongside existing raw evidence; no
      enabled sync/fetch/mutation control exists in TASK-0005.
  - id: AC-6
    requirement: "Accepted Phase 3 read-only and health invariants remain intact."
    evidence_required: >-
      Existing TASK-0003/TASK-0004 suites remain green; exact source/diff inspection finds no Git/GitHub mutation,
      dependency expansion, secret surface, hidden health persistence, or Phase 4+ implementation.
  - id: AC-7
    requirement: "Implementation/report lineage and runtime evidence are exact."
    evidence_required: >-
      Frozen install, full pnpm verify, bounded production loopback smoke/hygiene PASS; implementation is direct child
      of exact task base, report is its report-only child, final local/remote main match, zero tags and topology {main}.

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "Fresh-preflight exact TASK-0005 revision/base/task blob, accepted TASK-0004 review identity, clean synchronized MAIN_ONLY local state, and current required capabilities before mutation."
      required: true
    - id: CHECK-2
      command_or_check: "Run GitHub relation adapter/normalization fixtures including malformed/unavailable/error responses and exact immutable identity binding."
      required: true
    - id: CHECK-3
      command_or_check: "Run assessment + safe-sync-preview matrix tests proving stronger-current relation preference and all fail-closed eligibility cases."
      required: true
    - id: CHECK-4
      command_or_check: "Run UI/render tests showing relation/preview/reasons/exact SHAs with no mutation control and preserved raw evidence."
      required: true
    - id: CHECK-5
      command_or_check: "Run existing repository observation/read-only/health regression suites, fresh pnpm install --frozen-lockfile, full pnpm verify, then bounded 127.0.0.1 production smoke using only run-owned temporary Argus data."
      required: true
    - id: CHECK-6
      command_or_check: "Inspect exact diff, schema/migrations, dependencies, production Git/GitHub command/API boundaries, secrets, runtime artifacts and forward-scope terms; require no actual synchronization/mutation or Phase 4+ expansion."
      required: true
    - id: CHECK-7
      command_or_check: "Publish one implementation commit plus one report-only child; re-resolve final remote main, parent/diffs, task/report blobs, clean local state, zero tags and topology exactly {main}."
      required: true
  authoritative_verification:
    required: false
    mechanism: ""
    expected_signal: ""

