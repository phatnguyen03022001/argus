structure_authority:
  status: RESOLVED
  source: >-
    Extend the existing repository/GitHub observation and assessment surfaces in the current single-package app. Use
    the smallest local component/test changes needed. No new top-level package/service, dependency, schema framework,
    background worker, generic policy engine, mutation adapter, or shared orchestration abstraction is authorized.

objective: >-
  Make repository divergence classification and future fast-forward synchronization eligibility depend on current
  GitHub-canonical commit relationship rather than potentially stale local remote-tracking refs. Observe the exact
  relationship between current local HEAD and current GitHub ref through a read-only GitHub API contract, reconcile it
  with provenance/freshness semantics, derive a fail-closed fast-forward sync preview, and surface the preview in the
  existing UI without performing any Git/GitHub mutation.

scope:
  required_changes:
    - >-
      Extend the read-only GitHub observation boundary with one exact commit-relation observation between the current
      local HEAD SHA and the current observed GitHub ref SHA for the same canonical GitHub repository/ref. Use the
      source's compare/ancestry semantics or an equivalent GitHub read API; do not fetch or mutate local Git to learn
      the relationship.
    - >-
      Normalize the relation into {IDENTICAL, LOCAL_AHEAD, LOCAL_BEHIND, DIVERGED, UNKNOWN} with exact repository
      identity, local SHA, GitHub SHA, provenance, checked/observed time, availability/freshness, and source version or
      immutable input-pair identity where semantically valid. Malformed, unavailable, rate-limited, or identity-mismatched
      responses remain UNKNOWN/degraded evidence rather than optimistic classification.
    - >-
      Preserve the existing local ahead/behind observation as raw evidence, but repository sync-condition assessment
      must prefer a current available non-conflicted GitHub-canonical relation when present. It must never override a
      stronger degraded/conflict/identity gate and must not infer desired branch policy beyond the exact observed ref.
    - >-
      Add a pure `safe fast-forward sync preview` derived from current repository assessment plus exact relation and
      evidence. Preview state is {ELIGIBLE, NOT_NEEDED, BLOCKED, UNKNOWN}. ELIGIBLE requires exactly LOCAL_BEHIND plus
      current/available/non-conflicted canonical repository/ref/relation evidence, attached local HEAD, clean worktree,
      exact local/GitHub SHAs, and no identity mismatch. NOT_NEEDED requires exact IN_SYNC. Dirty, detached, local-ahead,
      diverged, mismatch/conflict, stale/unavailable evidence, or missing exact identity prevents eligibility.
    - >-
      Preview returns stable reason codes and the exact expected local pre-head plus expected GitHub target SHA that a
      later mutation task would have to revalidate immediately before effect. Preview is derived/non-authoritative and
      grants no mutation authority.
    - >-
      Surface the relation and sync preview in the existing repository/attention UI. The operator must be able to see
      why sync is eligible or blocked and the exact pre/target SHAs. Do not render an enabled mutation button in this
      task; a later task will add the explicit action only after this preview contract is accepted.
    - >-
      Keep all new external state as EXTERNAL_DERIVED_TRUTH observation/reconciliation data. A schema migration is
      allowed only if the existing generic observation model cannot persist the new observation kind without schema
      change; prefer the current observation table and no migration. Do not persist preview/health as source truth.
    - >-
      Add deterministic contract/domain/UI tests covering GitHub relation normalization for identical/ahead/behind/
      diverged/unavailable/malformed cases, freshness/conflict propagation, assessment preference over stale local
      tracking counts, and safe-sync preview eligibility/blocking for clean-behind, in-sync, dirty, detached, local-ahead,
      diverged, stale/unavailable/conflicted, and identity-mismatch cases.
    - >-
      Preserve TASK-0003 read-only Git invariance and TASK-0004 assessment behavior. Run fresh frozen-lockfile install,
      full repository-owned pnpm verify, bounded 127.0.0.1 production smoke with run-owned temporary Argus data, exact
      diff/dependency/schema/secret/forward-scope inspection, publish one implementation commit plus one report-only
      child on main, and stop at NEEDS_REVIEW.

  allowed_existing_files_or_components:
    - existing read-only GitHub observation adapter and repository observation model under src/
    - existing repository assessment/domain projection surface under src/
    - existing workspace/repository application/UI surfaces under src/ and app/
    - existing tests under tests/
    - README.md only if current Phase 3 wording becomes materially stale
    - .agent/tasks/TASK-0005/report.yaml
  expected_files_are_restrictive: false

invariants:
  - "GitHub remote main remains canonical repository truth and Argus topology remains exactly {main}."
  - "TASK-0005 is observation + preview only; it performs no Git/GitHub mutation and grants no mutation authority."
  - "No local fetch/pull/merge/rebase/reset/checkout/clean/stash/push or remote ref mutation is introduced."
  - "Safe-sync preview is derived from current exact evidence and becomes invalid on any identity/ref/local-state drift."
  - "Potentially stale local remote-tracking counts cannot override a current GitHub-canonical commit relationship."
  - "Dirty, detached, diverged, local-ahead, conflicting, stale, unavailable, unknown, or identity-mismatched state cannot be marked sync-eligible."
  - "No numeric score, hidden auto-sync queue, retry daemon, force path, or generic mutation command surface is introduced."
  - "No secret value enters persistence, logs, UI, tests, reports, or repository artifacts."

forbidden_changes:
  - "Do not implement the actual fast-forward sync action, fetch, merge, reset, push, rebase, checkout, stash, clean, or force operation."
  - "Do not add environment/Keychain, provider/resource, task/agent/business, deployment, or Phase 4+ capability."
  - "Do not add dependencies, package boundaries, services, background polling/watchers, generic policy DSLs, mutation queues, or workflow engines."
  - "Do not infer repository policy from default-branch names or local branch conventions beyond the exact observed ref relationship."
  - "Do not create branches/tags/releases/workflows or mutate another repository."

gap_policy:
  local_auto_fix: true
  scope_expansion: forbidden
  architecture_change: forbidden
  spec_change: forbidden
  dependency_change: forbidden
  public_contract_change: forbidden
  blocking_gap_behavior: BLOCKED

continuation_policy:
  mode: MANUAL
  stop_conditions:
    - BLOCKED
    - STALE_STATE
    - AUTHORITY_REQUIRED
    - CURRENT_PHASE_CAPABILITY_UNAVAILABLE
    - REVIEW_REQUIRED
    - REVERIFY_REQUIRED
    - USER_STOP

